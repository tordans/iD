de:
  traffic_sign_field:
    order_hint: Schilder werden von oben nach unten gelesen. Das oberste Schild ist das Hauptschild.
    open_tool: Im Verkehrszeichen-Tool öffnen
    drag: Zum Umsortieren ziehen oder Pfeiltasten nutzen
    empty: Noch keine Schilder. Unten nach Name oder Zeichen-ID suchen, um eines hinzuzufügen.
    add_sign: Schild hinzufügen…
    unknown_sign: Unbekanntes Schild
    no_sign: Unbeschildert
    no_sign_description: Hier steht explizit kein Verkehrsschild (traffic_sign=none)
  map_display:
    title: Kartendarstellung
    description: Kartendarstellung
  photos_pane:
    title: Fotos
    description: Fotos
  pane_tooltips:
    background: Luftbilder, Überlagerungen, Helligkeit und Bildversatz.
    map-data: OpenStreetMap-Daten und -Hinweise, QA-Ebenen, eigene Datenebenen und Live-Bearbeitungen.
    map-display: Flächenfüllung, Linse und welche Objektarten angezeigt werden.
    photos: Straßenfotos, ihre Filter und die Verkehrszeichen.
    issues: Fehler und Warnungen in deinen Änderungen und in der Karte.
    preferences: Werkzeugleisten-Beschriftung, Info-Felder, Datenschutz und Favoriten.
    help: Dokumentation, Einführung und Tastaturkürzel.
  tilda_notes:
    title: TILDA-Hinweis
    private: "Interner Hinweis: Nur Mitglieder dieser Region in TILDA sehen ihn."
    new: Neuer TILDA-Hinweis
    status:
      open: offen
      closed: erledigt
    replies: "{count} Antworten"
    loading: Hinweis wird geladen …
    not_loaded: Der Hinweis konnte nicht geladen werden.
    no_body: Es wurde nur ein Betreff angegeben.
    subject: Betreff
    body: Hinweis
    body_placeholder: "Beschreibe, was dir aufgefallen ist (Markdown)."
    reply: Antwort
    reply_placeholder: "Schreibe eine Antwort (Markdown)."
    save_explanation: "Wird sofort in TILDA gespeichert, nicht mit deinen OpenStreetMap-Änderungen. Nicht öffentlich."
    save: Hinweis speichern
    save_reply: Antwort speichern
    resolve: Als erledigt markieren
    resolve_reply: Antworten und erledigen
    reopen: Wieder öffnen
    reopen_reply: Antworten und wieder öffnen
    open_in_tilda: In TILDA öffnen
    open_tilda: TILDA öffnen
    add:
      title: TILDA
      osm_title: OSM
      description: "Internen TILDA-Hinweis hinzufügen. Nur Mitglieder des Projekts sehen ihn."
    errors:
      login: "Melde dich bei OpenStreetMap an, um TILDA-Hinweise zu sehen und zu schreiben."
      invalid_osm_token: "OpenStreetMap hat deine Anmeldung nicht akzeptiert. Melde dich neu an."
      no_tilda_user: "Dein OpenStreetMap-Konto hat noch kein TILDA-Konto. Melde dich einmal bei TILDA an."
      not_member: "Du bist in TILDA kein Mitglied dieser Region. Bitte um Zugang."
      network: "TILDA ist nicht erreichbar."
      other: "TILDA: {message}"
  map_data:
    layers:
      notes:
        title: OpenStreetMap-Hinweise (öffentlich)
        tooltip: Öffentliche Hinweise von OpenStreetMap. Jede:r kann sie lesen.
      tilda-notes:
        title: TILDA-Hinweise (intern)
        tooltip: Interne Hinweise des Projekts aus TILDA. Nur Mitglieder der Region sehen sie.
  modes:
    add_note:
      description: "Öffentlichen OpenStreetMap-Hinweis hinzufügen. Jede:r kann ihn lesen."
  preferences:
    panels:
      title: Info-Felder
  inspector:
    hidden_preset:
      manual: "{features} sind versteckt. Schalte sie im Bereich Kartendarstellung ein."
  help:
    streetlevel:
      using: "Um Straßenfotos beim Bearbeiten zu benutzen, öffne den Bereich {photos_icon} **{photos}** am Rand der Karte und schalte dort die verfügbaren Bildquellen ein oder aus."
  shortcuts:
    browsing:
      display_options:
        map_display: "Kartendarstellung ein-/ausblenden"
        photos: "Fotos ein-/ausblenden"
